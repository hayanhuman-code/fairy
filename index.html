<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우리 아기 이야기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='55' r='34' fill='%23eec871'/%3E%3Cellipse cx='18' cy='56' rx='11' ry='21' fill='%23d9a94e'/%3E%3Cellipse cx='82' cy='56' rx='11' ry='21' fill='%23d9a94e'/%3E%3Cellipse cx='50' cy='68' rx='17' ry='13' fill='%23fdf6e3'/%3E%3Cellipse cx='50' cy='61' rx='6' ry='4' fill='%235a4636'/%3E%3Ccircle cx='39' cy='49' r='4.5' fill='%235b4636'/%3E%3Ccircle cx='61' cy='49' r='4.5' fill='%235b4636'/%3E%3C/svg%3E" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; padding: 40px 20px 32px;
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    background: #fdf6ef; color: #5b4636;
    display: flex; flex-direction: column; align-items: center; gap: 32px;
  }
  h1 { margin: 0; font-size: clamp(30px, 6vw, 46px); color: #7a5a40; letter-spacing: -.01em; }
  .grid { display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; width: 100%; max-width: 860px; }
  .card {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    width: min(88vw, 320px); padding: 26px 22px 24px; text-decoration: none; color: inherit;
    background: #fff; border: 4px solid #f0d9c2; border-radius: 32px;
    box-shadow: 0 6px 0 rgba(90,74,56,.14), 0 14px 28px rgba(90,74,56,.10);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .card:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(90,74,56,.14), 0 6px 14px rgba(90,74,56,.10); }
  .card svg { width: 150px; height: auto; }
  .name { font-size: 30px; font-weight: 900; color: #7a5a40; }
  .sub  { font-size: 19px; font-weight: 700; color: #a98d70; }
  .go {
    margin-top: 4px; padding: 12px 30px; border-radius: 40px;
    background: #f6a96b; color: #fff; font-size: 24px; font-weight: 900;
    box-shadow: 0 4px 0 #d98643;
  }
  .note { max-width: 520px; text-align: center; font-size: 15px; line-height: 1.6; color: #a98d70; }
</style>
</head>
<body>
  <h1>우리 아기 이야기</h1>

  <div class="grid">
    <p class="note">새 이야기를 만들고 있어요. 조금만 기다려 주세요 🐋</p>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우리 아기 이야기</title>
<link rel="icon" href="coding-fairytale-stories/whale-robot/favicon.svg" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; padding: 40px 20px 32px;
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    background: #fdf6ef; color: #5b4636;
    display: flex; flex-direction: column; align-items: center; gap: 32px;
  }
  h1 { margin: 0; font-size: clamp(30px, 6vw, 46px); color: #7a5a40; letter-spacing: -.01em; }
  .grid { display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; width: 100%; max-width: 860px; }
  .card {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    width: min(88vw, 320px); padding: 26px 22px 24px; text-decoration: none; color: inherit;
    background: #fff; border: 4px solid #f0d9c2; border-radius: 32px;
    box-shadow: 0 6px 0 rgba(90,74,56,.14), 0 14px 28px rgba(90,74,56,.10);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .card:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(90,74,56,.14), 0 6px 14px rgba(90,74,56,.10); }
  .card svg { width: 150px; height: auto; }
  .name { font-size: 30px; font-weight: 900; color: #7a5a40; }
  .sub  { font-size: 19px; font-weight: 700; color: #a98d70; }
  .go {
    margin-top: 4px; padding: 12px 30px; border-radius: 40px;
    background: #f6a96b; color: #fff; font-size: 24px; font-weight: 900;
    box-shadow: 0 4px 0 #d98643;
  }
  .note { max-width: 520px; text-align: center; font-size: 15px; line-height: 1.6; color: #a98d70; }
</style>
</head>
<body>
  <h1>우리 아기 이야기</h1>

  <div class="grid">
    <a class="card" href="coding-fairytale-stories/whale-robot/index.html">
      <svg viewBox="-200 -200 360 220" aria-hidden="true">
        <path d="M-112 -52 Q-150 -72 -176 -118 Q-150 -108 -138 -90 Q-164 -62 -192 -58 Q-152 -40 -116 -28Z" fill="#7cc4ea" stroke="#3c86b5" stroke-width="4"/>
        <path d="M-122 -22 C-132 -92 -62 -142 20 -142 C92 -142 134 -102 134 -52 C134 -12 104 0 62 0 L-82 0 C-106 0 -120 -8 -122 -22Z" fill="#8fd0f0" stroke="#3c86b5" stroke-width="4"/>
        <path d="M-114 -16 Q10 -2 132 -40 C130 -10 102 0 62 0 L-82 0 C-100 0 -112 -6 -114 -16Z" fill="#eef8ff"/>
        <rect x="16" y="-160" width="26" height="22" rx="6" fill="#d7e4ec" stroke="#3c86b5" stroke-width="3"/>
        <line x1="29" y1="-160" x2="29" y2="-176" stroke="#3c86b5" stroke-width="3"/><circle cx="29" cy="-180" r="6" fill="#ff7a8a"/>
        <circle cx="4" cy="-48" r="15" fill="#ffe066" stroke="#3c86b5" stroke-width="3"/>
        <circle cx="84" cy="-86" r="14" fill="#fff"/><circle cx="86" cy="-86" r="7.5" fill="#24445a"/>
        <path d="M98 -58 Q112 -42 126 -58" stroke="#24445a" stroke-width="4" fill="none" stroke-linecap="round"/>
        <ellipse cx="108" cy="-70" rx="9" ry="6" fill="#ff9aa8" opacity=".6"/>
      </svg>
      <div class="name">고래로봇과 배</div>

    </a>

</body>
</html>

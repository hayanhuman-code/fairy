<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>고래로봇과 배</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M12 70 C8 40 40 22 62 22 C84 22 96 40 96 58 C96 74 84 80 70 80 L24 80 C16 80 12 76 12 70Z' fill='%236fbbe6' stroke='%233c86b5' stroke-width='4'/%3E%3Ccircle cx='76' cy='48' r='6' fill='%2324445a'/%3E%3Crect x='50' y='12' width='10' height='10' rx='3' fill='%23d7e4ec'/%3E%3C/svg%3E" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    background: #fdf8ef; color: #3b4a58;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  #book { height: 100dvh; height: 100vh; display: flex; flex-direction: column; }
  @supports (height: 100dvh) { #book { height: 100dvh; } }

  /* 그림칸 — 안은 전부 절대배치. flex 로 높이를 받으니 min-height:0 만 주고 flex 는 건드리지 않는다. */
  .pic { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; background: #bfe8ff; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #scene.enter { animation: fadeIn .45s ease; }   /* 투명도만 — transform 은 쓰지 않는다 */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  #ask {
    position: absolute; left: 12px; top: 10px; max-width: min(62%, 460px);
    padding: 6px 12px; border-radius: 14px; background: rgba(255,255,255,.78);
    font-size: 14px; line-height: 1.45; color: #6a7b8a;
  }
  #ask::before { content: "💬 "; }
  #count { position: absolute; right: 14px; top: 12px; font-size: 13px; color: #6a7b8a;
           background: rgba(255,255,255,.7); padding: 3px 10px; border-radius: 10px; }

  /* 넘김 버튼 — 그림칸 아래 두 구석, 늘 같은 자리 */
  .nav {
    position: absolute; bottom: 14px; width: 78px; height: 78px; border-radius: 50%;
    border: 0; font-size: 34px; font-weight: 900; color: #fff; cursor: pointer;
    background: #f6a96b; box-shadow: 0 5px 0 #d98643; display: grid; place-items: center;
  }
  .nav:active { box-shadow: 0 1px 0 #d98643; margin-bottom: -4px; }
  #prev { left: 14px; background: #b9c6d2; box-shadow: 0 5px 0 #93a3b1; }
  #next { right: 14px; }
  .nav[hidden] { display: none; }
  .nav.locked { background: #d6dde3; box-shadow: 0 5px 0 #b7c1ca; opacity: .6; }
  #next.pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { background: #ff8f4a; } }
  #say {
    position: absolute; right: 14px; top: 44px; width: 52px; height: 52px; border-radius: 50%;
    border: 0; background: rgba(255,255,255,.85); font-size: 26px; cursor: pointer;
  }

  /* 글월 — 글자 하나 = 버튼 하나 */
  .bar {
    flex: 0 0 auto; display: flex; justify-content: center; align-items: center;
    padding: 12px 10px 16px; background: #fffdf7; border-top: 4px solid #f0e2c8;
    min-height: calc(var(--fs) * 1.5 + 28px);
    --fs: clamp(34px, min(9.2vw, 10.5vh), 84px);
  }
  #line { display: flex; flex-wrap: nowrap; align-items: flex-end; white-space: nowrap; }
  .ch {
    font: inherit; font-size: var(--fs); font-weight: 900; line-height: 1.25;
    color: #3b4a58; background: none; border: 0; padding: 0 .04em; margin: 0;
    border-radius: .18em; cursor: pointer; transition: color .15s, background .15s;
  }
  .ch.on  { color: #e8663d; background: #fff0c9; }
  .ch.tap { color: #fff; background: #5fb3e0; }
  .gap  { display: inline-block; width: calc(var(--fs) * .32); }
  .punc { font-size: calc(var(--fs) * .8); font-weight: 900; color: #9aa8b4; padding: 0 .02em; }
  .cover .ch { color: #3c86b5; }

  /* 좁은 화면 — 자간·여백만 줄인다 (그림칸 flex 는 그대로) */
  @media (max-width: 480px) {
    .bar { padding: 10px 4px 14px; --fs: clamp(30px, 10.4vw, 44px); }
    .ch { padding: 0 .01em; }
    .gap { width: calc(var(--fs) * .22); }
    .nav { width: 62px; height: 62px; font-size: 28px; }
    #ask { font-size: 13px; }
  }

  /* 그림 움직임 — SVG 안쪽 g 에만 건다 */
  .a-bob   { animation: bob 3s ease-in-out infinite; }
  .a-rock  { animation: rock 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  .a-glide { animation: glide 5s ease-in-out infinite; }
  .a-sail  { animation: sail 6s ease-in-out infinite alternate; }
  .a-flap  { animation: flap .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  .a-wave  { animation: fin 1.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 0% 0%; }
  .a-hello { animation: hello .7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 0% 100%; }
  .a-drip  { animation: drip 1.6s ease-in infinite; }
  @keyframes bob   { 50% { transform: translateY(-8px); } }
  @keyframes rock  { 25% { transform: rotate(1.5deg); } 75% { transform: rotate(-1.5deg); } }
  @keyframes glide { 50% { transform: translate(24px, -10px); } }
  @keyframes sail  { to { transform: translateX(-60px); } }
  @keyframes flap  { to { transform: scaleY(.55); } }
  @keyframes fin   { to { transform: rotate(-14deg); } }
  @keyframes hello { to { transform: rotate(-22deg); } }
  @keyframes drip  { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(26px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
  <div id="book">
    <div class="pic">
      <svg id="scene" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
      <div id="ask"></div>
      <div id="count"></div>
      <button id="say" aria-label="다시 읽어 주기">🔊</button>
      <button id="prev" class="nav" aria-label="앞으로">◀</button>
      <button id="next" class="nav" aria-label="다음">▶</button>
    </div>
    <div class="bar"><div id="line"></div></div>
  </div>

  <script src="art.js"></script>
  <script src="pages.js"></script>
  <script src="book.js"></script>
</body>
</html>

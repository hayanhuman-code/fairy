<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='55' r='34' fill='%23eec871'/%3E%3Cellipse cx='18' cy='56' rx='11' ry='21' fill='%23d9a94e'/%3E%3Cellipse cx='82' cy='56' rx='11' ry='21' fill='%23d9a94e'/%3E%3Cellipse cx='50' cy='68' rx='17' ry='13' fill='%23fdf6e3'/%3E%3Cellipse cx='50' cy='61' rx='6' ry='4' fill='%235a4636'/%3E%3Ccircle cx='39' cy='49' r='4.5' fill='%235b4636'/%3E%3Ccircle cx='61' cy='49' r='4.5' fill='%235b4636'/%3E%3C/svg%3E" />
<title>보리와 두두</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    background: #fdf6ef; color: #5b4636;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  #app { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; }

  /* ── 책 ───────────────────────────────────────────── */
  .book { height: 100%; display: flex; flex-direction: column; padding: 12px 14px 8px; gap: 10px; }

  /* 그림: 위쪽. 글자의 배경이지 주인공이 아니다 */
  .pic {
    flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden;
    border-radius: 26px; border: 4px solid #f0d9c2; background: #fff;
    box-shadow: 0 5px 0 rgba(90,74,56,.10);
  }
  .pic .bg { position: absolute; inset: 0; }
  .pic .bg svg { width: 100%; height: 100%; display: block; }
  /* #stage 는 그림칸을 꽉 채워야 한다. pageIn 애니메이션이 transform 을 걸면
     #stage 가 위치 기준(containing block)이 되는데, 높이가 0이면 top:56% 가
     전부 0으로 계산되어 등장인물이 그림 맨 위에 붙어 버린다. */
  #stage { position: absolute; inset: 0; }
  .actor, .prop { position: absolute; }
  .actor { z-index: 2; } .prop { z-index: 1; }
  .actor svg, .prop svg { display: block; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
  .bob { animation: bob 1.7s ease-in-out infinite; }
  @keyframes pageIn { from { opacity:0; transform: translateY(8px) } to { opacity:1; transform:none } }
  .pageIn { animation: pageIn .3s ease both; }

  /* 글: 크게, 한 줄. 글자 하나가 곧 버튼 */
  .line {
    flex: 0 0 auto; display: flex; justify-content: center; align-items: flex-end;
    gap: clamp(2px, .8vw, 8px); flex-wrap: wrap; min-height: 1.2em;
  }
  .syl {
    font-family: inherit; font-size: clamp(34px, 7.4vw, 76px); font-weight: 800; line-height: 1.08;
    color: #5b4636; background: none; border: none; padding: 4px 8px 8px;
    border-radius: 16px; cursor: pointer; min-width: 1.05em; text-align: center;
    transition: transform .16s, color .16s, background .16s;
  }
  .syl.gap { min-width: .42em; pointer-events: none; }
  .syl:active { transform: scale(.92); }
  .syl.now { color: #d1741f; background: #ffeedd; transform: translateY(-9px) scale(1.06); }
  .syl.tapped { color: #3f8f5e; background: #e7f5eb; }
  .syl:focus-visible { outline: 4px solid #a9c7ff; outline-offset: 2px; }

  /* 손잡이: 크고 셋뿐 */
  .bar { flex: 0 0 auto; position: relative; display: flex; align-items: center;
         justify-content: center; gap: 16px; padding-bottom: 16px; }
  .btn { border: none; border-radius: 999px; cursor: pointer; font-weight: 900;
         font-family: inherit; color: #fff; display: flex; align-items: center; justify-content: center;
         gap: 8px; transition: transform .1s, box-shadow .1s; }
  .btn:active { transform: translateY(4px); }
  .btn:disabled { opacity: .45; }
  .round { width: 74px; height: 74px; font-size: 32px; }
  .listen { background: #7fb2d9; box-shadow: 0 5px 0 #5f92ba; }
  .listen:active { box-shadow: 0 1px 0 #5f92ba; }
  .back { background: #cbb9a4; box-shadow: 0 5px 0 #a99781; width: 62px; height: 62px; font-size: 26px; }
  .back:active { box-shadow: 0 1px 0 #a99781; }
  .next { background: #f6a96b; box-shadow: 0 5px 0 #d98643;
          font-size: clamp(22px, 3.6vw, 32px); padding: 16px 36px; }
  .next:active { box-shadow: 0 1px 0 #d98643; }
  .dots { position: absolute; left: 50%; transform: translateX(-50%); bottom: 0;
          display: flex; gap: 5px; max-width: 78vw; flex-wrap: wrap; justify-content: center; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #e6d3bd; }
  .dot.on { background: #f6a96b; }

  /* 위쪽 작은 단추 */
  .top { position: absolute; top: 10px; right: 12px; z-index: 30; display: flex; gap: 8px; }
  .icon { width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer;
          background: rgba(255,255,255,.86); box-shadow: 0 2px 6px rgba(0,0,0,.12);
          font-size: 22px; display: grid; place-items: center; }
  .icon.off { opacity: .42; }
  #parent { position: absolute; top: 64px; right: 12px; z-index: 29; display: none;
            max-width: min(74vw, 360px); background: #fff7ee; border: 2px solid #f0d9c2;
            border-radius: 16px; padding: 13px 15px; box-shadow: 0 6px 16px rgba(0,0,0,.12);
            font-size: 16px; line-height: 1.5; color: #6b5240; }
  #parent b { color: #c9763d; }

  /* 쓰기 페이지 */
  #writeBox { position: absolute; inset: 0; z-index: 3; display: none; }

  /* 첫 화면 */
  #start { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column;
           align-items: center; justify-content: center; gap: 20px; text-align: center; padding: 24px;
           background: radial-gradient(circle at 50% 36%, #fff3e0, #f7d9b9); }
  #start h1 { margin: 0; font-size: clamp(30px, 6vw, 52px); color: #7a5a40; }
  #start .sub { font-size: clamp(16px, 2.6vw, 21px); color: #9a7a5e; }
  #startArt { width: min(46vw, 240px); }
  #startArt svg { width: 100%; height: auto; }
  #go { background: #f6a96b; box-shadow: 0 7px 0 #d98643; font-size: clamp(26px, 5vw, 40px);
        padding: 22px 54px; }
  #go:active { box-shadow: 0 2px 0 #d98643; }
  .hint { font-size: 14px; color: #a98d70; }

  /* 좁은 화면(폰 세로): 글자·여백을 좁혀 여덟 자가 한 줄에 들어가게 한다.
     접히면 읽는 흐름이 흐트러진다. 그림칸 높이는 건드리지 않는다 —
     안이 전부 절대배치라 flex 를 손대면 칸이 찌그러진다. */
  @media (max-width: 620px) {
    .syl { font-size: clamp(36px, 9.4vw, 60px); padding: 3px 2px 6px; min-width: .96em; }
    .line { gap: 1px; }
    .round { width: 62px; height: 62px; font-size: 26px; }
    .back { width: 52px; height: 52px; font-size: 22px; }
    .next { padding: 14px 26px; }
    .bar { gap: 12px; padding-bottom: 20px; }
    .dot { width: 5px; height: 5px; }
    .dots { gap: 3px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bob, .pageIn { animation: none !important; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="book">
    <div class="pic">
      <div class="bg" id="bg"></div>
      <div id="stage"></div>
      <div id="writeBox"></div>
    </div>
    <div class="line" id="line"></div>
    <div class="bar">
      <button class="btn back" id="back" aria-label="앞으로">◀</button>
      <button class="btn round listen" id="listen" aria-label="읽어 줘">🔊</button>
      <button class="btn next" id="next">가자 ▶</button>
      <div class="dots" id="dots"></div>
    </div>
  </div>

  <div class="top">
    <button class="icon" id="bgm" aria-label="음악">🎵</button>
    <button class="icon" id="parentBtn" aria-label="부모님 보기">👪</button>
  </div>
  <div id="parent"></div>

  <div id="start">
    <h1>보리와 두두</h1>
    <div id="startArt"></div>
    <div class="sub">우리 배 타고 가자</div>
    <button class="btn" id="go">▶ 가자</button>
    <p class="hint">글자를 하나씩 눌러 보세요. 소리가 나와요 💛</p>
  </div>
</div>

<!-- 그림 → 이야기 그림 → 내용 → 글자 획순 → 쓰기 → 책 순으로 로드.
     engine.js 는 쓰지 않는다. 그림(art.js)만 빌려 온다. -->
<script src="art.js"></script>
<script src="story-art.js"></script>
<script src="pages.js"></script>
<script src="hangul-data.js"></script>
<script src="write-page.js"></script>
<script src="book.js"></script>
</body>
</html>
